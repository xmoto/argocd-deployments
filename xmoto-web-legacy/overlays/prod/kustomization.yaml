apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- route.yaml

namespace: prod

generators:
- ./secret-generator.yaml

configMapGenerator:
- envs:
  - config.env
  name: config
  options:
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/sync-wave: "-2"

images:
- name: ghcr.io/xmoto/xmoto-web-legacy-php
  newName: ghcr.io/xmoto/xmoto-web-legacy-php
  newTag: 096610a9834a446c6184e74d6e3589f99581faaf
- name: ghcr.io/xmoto/xmoto-web-legacy-web
  newName: ghcr.io/xmoto/xmoto-web-legacy-web
  newTag: 096610a9834a446c6184e74d6e3589f99581faaf
