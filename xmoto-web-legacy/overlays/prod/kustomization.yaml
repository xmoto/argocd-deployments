apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- route.yaml

namespace: prod

generators:
- ./secret-generator.yaml

configMapGenerator:
- envs:
  - config.env
  name: config
  options:
    annotations:
      argocd.argoproj.io/hook: PreSync
      argocd.argoproj.io/sync-wave: "-2"

images:
- name: ghcr.io/xmoto/xmoto-web-legacy-php
  newName: ghcr.io/xmoto/xmoto-web-legacy-php
  newTag: 5287cf1546b6f61359ba3713d5db0f1a2b23a27e
- name: ghcr.io/xmoto/xmoto-web-legacy-web
  newName: ghcr.io/xmoto/xmoto-web-legacy-web
  newTag: 5287cf1546b6f61359ba3713d5db0f1a2b23a27e
